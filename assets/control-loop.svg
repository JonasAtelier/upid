<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">A closed control loop settling on its setpoint</title>
  <desc id="d">A pulse circulates a PID control loop while the step response draws itself and settles on the dashed setpoint line.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#102f34"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family: ui-monospace, monospace; font-size: 12px; fill: #9edbc4; letter-spacing: 1px; }
      .blk  { font-family: ui-monospace, monospace; font-size: 14px; fill: #e8f5ef; letter-spacing: 1.5px; }
      .wire { stroke: #51c99c; stroke-width: 2.2; fill: none; opacity: .75; }
      .box  { fill: none; stroke: #70e1b2; stroke-width: 2; opacity: .85; }
      .grid { stroke: #234a52; stroke-width: 1; opacity: .55; }
      .resp { fill: none; stroke: #70e1b2; stroke-width: 3;
              stroke-dasharray: 1000; stroke-dashoffset: 1000;
              animation: draw 6s linear infinite; }
      .sp   { stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .resp { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" rx="24" fill="url(#bg2)"/>

  <!-- closed loop, left -->
  <path id="loop" class="wire" d="M52 100H104M136 100H176M256 100H296M376 100H424V162H120V116"/>
  <circle cx="120" cy="100" r="16" class="box"/>
  <text class="blk" x="120" y="106" text-anchor="middle">+</text>
  <rect class="box" x="176" y="80" width="80" height="40" rx="6"/>
  <text class="blk" x="216" y="106" text-anchor="middle">PID</text>
  <rect class="box" x="296" y="80" width="80" height="40" rx="6"/>
  <text class="blk" x="336" y="106" text-anchor="middle">PLANT</text>
  <text class="lbl" x="52"  y="86">setpoint</text>
  <text class="lbl" x="272" y="180">feedback</text>

  <circle r="5" fill="#f2bd68" filter="url(#g2)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loop"/>
    </animateMotion>
  </circle>

  <line x1="456" y1="26" x2="456" y2="174" stroke="#234a52" stroke-width="1" opacity=".6"/>

  <!-- scope, right -->
  <g class="grid">
    <line x1="500" y1="40"  x2="1140" y2="40"/>
    <line x1="500" y1="80"  x2="1140" y2="80"/>
    <line x1="500" y1="120" x2="1140" y2="120"/>
    <line x1="500" y1="160" x2="1140" y2="160"/>
    <line x1="606" y1="34" x2="606" y2="166"/>
    <line x1="713" y1="34" x2="713" y2="166"/>
    <line x1="820" y1="34" x2="820" y2="166"/>
    <line x1="926" y1="34" x2="926" y2="166"/>
    <line x1="1033" y1="34" x2="1033" y2="166"/>
  </g>
  <line class="sp" x1="500" y1="70" x2="1140" y2="70"/>

