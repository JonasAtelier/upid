               animation: draw 6s linear infinite; }
      .trace2{ fill: none; stroke: #f2bd68; stroke-width: 2.6; opacity: .9;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
