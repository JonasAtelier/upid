  <circle r="5.5" fill="#70e1b2" filter="url(#g2)">
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;1;1" keyTimes="0;0.72;1">
      <mpath href="#resp"/>
    </animateMotion>
  </circle>

  <text class="lbl" x="500" y="186">step response</text>
  <text class="lbl" x="1140" y="186" text-anchor="end" fill="#f2bd68">&#950; = 0.45 &#183; &#969;n = 2.2 rad/s</text>
</svg>
