      .truth { fill: none; stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .drift { fill: none; stroke: #d97a6c; stroke-width: 2.2; opacity: .72; }
      .band  { fill: #70e1b2; opacity: .13; }
